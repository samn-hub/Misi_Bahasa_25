<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekod markah · Misi Bahasa</title><link rel="stylesheet" href="style.css"><main><header><a href="/">← Misi Bahasa</a><h1>Rekod Misi Bahasa</h1><a href="/?mod=latihan">Cuba kuiz tanpa masuk ranking →</a></header><section class="card" id="login"><form><label for="code">Kod akses guru</label><input type="password" id="code" required autocomplete="current-password"> <button>Buka rekod</button></form></section><p role="status" id="status"></p><section class="card" hidden id="panel"><label for="search">Cari nama atau kelas</label><input id="search" type="search"> <button id="refresh">Muat semula</button> <button id="logout">Keluar</button><p id="count"></p><div class="table-wrap"><table><thead><tr><th>Nama / jawapan</th><th>Kelas</th><th>Markah</th><th>Waktu hantar</th></tr></thead><tbody id="records"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let rows=[],secret='';
function draw(){
 const q=$('search').value.trim().toLowerCase(),filtered=rows.filter(r=>(r.name+' '+r.classroom).toLowerCase().includes(q));$('records').replaceChildren();
 $('count').textContent=filtered.length+' penghantaran';
 for(const r of filtered){
 const tr=document.createElement('tr'),name=document.createElement('td'),details=document.createElement('details'),title=document.createElement('summary');
 title.textContent=r.name;details.append(title);const data=JSON.parse(r.answers);
 data.forEach((n,i)=>{const line=document.createElement('p');line.textContent='Soalan '+(i+1)+' · Pilihan '+String.fromCharCode(65+n);details.append(line)});
 const remove=document.createElement('button');remove.textContent='Padam keputusan ini';remove.onclick=async()=>{
   if(!confirm('Padam keputusan '+r.name+' ('+r.classroom+'), '+r.score+' XP, dihantar pada '+new Date(r.created).toLocaleString('ms-MY')+'?'))return;
   remove.disabled=true;
   try{
     const res=await fetch('/api/kuiz',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+secret},body:JSON.stringify({mode:'padam',id:r.id})});
     if(!res.ok)throw Error();rows=rows.filter(row=>row.id!==r.id);draw();$('status').textContent='Keputusan dipadam.';
   }catch{$('status').textContent='Pemadaman belum disahkan. Muat semula rekod untuk menyemak.';remove.disabled=false}
 };details.append(remove);
 name.append(details);tr.append(name);
 for(const value of [r.classroom,r.score+' / 25',new Date(r.created).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur'})]){const td=document.createElement('td');td.textContent=value;tr.append(td)}
 $('records').append(tr)}
}
async function load(){
 const active=secret||$('code').value.trim();$('status').textContent='Memuatkan rekod…';
 try{const res=await fetch('/api/kuiz',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+active},body:JSON.stringify({mode:'guru'})});if(!res.ok)throw Error(res.status===403?'Kod akses tidak tepat.':'Rekod belum dapat dimuatkan. Cuba lagi.');
 rows=await res.json();secret=active;$('code').value='';$('login').hidden=true;$('panel').hidden=false;$('status').textContent='';draw()}catch(e){$('status').textContent=e.message}
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();load()};$('refresh').onclick=load;$('search').oninput=draw;$('logout').onclick=()=>location.reload();
</script></html>
